<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSIRIS</title>
<style>
  :root {
    --bg: #050805; --panel: #081008; --line: #123a12;
    --fg: #33ff66; --dim: #1d8a3f; --faint: #0f5223;
    --amber: #ffcc44; --red: #ff5566;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.55 "Cascadia Mono", "Consolas", monospace;
    height: 100vh; overflow: hidden;
  }
  /* CRT scanlines + vignette */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 99;
    background:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.14) 2px 4px),
      radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.45));
  }
  #app { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr auto; height: 100vh; }

  header {
    grid-column: 1 / -1; display: flex; align-items: baseline; gap: 16px;
    padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 18px; letter-spacing: 5px; text-shadow: 0 0 8px var(--dim); }
  header .sub { color: var(--dim); font-size: 12px; }
  header .providers { margin-left: auto; color: var(--dim); font-size: 12px; }
  header .providers b { color: var(--fg); font-weight: normal; }

  #chat { overflow-y: auto; padding: 18px; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
  .msg { margin-bottom: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg .who { color: var(--dim); user-select: none; }
  .msg.user .who { color: var(--amber); }
  .msg.error { color: var(--red); }
  .agentbadge {
    display: inline-block; font-size: 11px; color: var(--bg); background: var(--dim);
    padding: 0 7px; border-radius: 2px; margin-left: 8px; vertical-align: 1px;
  }
  .agentbadge.provider { background: transparent; color: var(--dim); border: 1px solid var(--dim); }
  .tool { color: var(--faint); font-size: 12.5px; margin: 2px 0 2px 14px; }
  .tool::before { content: "⚙ "; }
  .thinking { color: var(--dim); }
  .thinking::after { content: "▌"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  aside {
    border-left: 1px solid var(--line); background: var(--panel);
    overflow-y: auto; padding: 14px; font-size: 12.5px;
    scrollbar-width: thin; scrollbar-color: var(--faint) transparent;
  }
  aside h2 {
    font-size: 11px; letter-spacing: 3px; color: var(--dim);
    border-bottom: 1px dashed var(--line); padding-bottom: 4px; margin: 14px 0 8px;
  }
  aside h2:first-child { margin-top: 0; }
  aside .item { margin-bottom: 6px; color: var(--fg); }
  aside .item .meta { color: var(--faint); font-size: 11px; }
  aside .done { color: var(--faint); text-decoration: line-through; }
  aside .empty { color: var(--faint); font-style: italic; }
  #memcount { color: var(--dim); }

  form {
    grid-column: 1 / -1; display: flex; gap: 10px; padding: 12px 18px;
    border-top: 1px solid var(--line); background: var(--panel);
  }
  form .prompt { color: var(--amber); }
  input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--fg); font: inherit; caret-color: var(--fg);
  }
  input::placeholder { color: var(--faint); }
  button {
    background: transparent; color: var(--dim); border: 1px solid var(--line);
    font: inherit; font-size: 12px; padding: 2px 14px; cursor: pointer;
  }
  button:hover:not(:disabled) { color: var(--fg); border-color: var(--dim); }
  button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>OSIRIS</h1>
    <span class="sub">intelligence as the kernel</span>
    <span class="providers">providers: <b id="providers">…</b> · <span id="memcount"></span></span>
  </header>

  <main id="chat">
    <div class="msg"><span class="who">osiris › </span>online. goals, mail, drive, github, calendar — what do you need?</div>
  </main>

  <aside>
    <h2>GOALS</h2><div id="goals"><div class="empty">loading…</div></div>
    <h2>TASKS</h2><div id="tasks"><div class="empty">loading…</div></div>
  </aside>

  <form id="form" autocomplete="off">
    <span class="prompt">you ›</span>
    <input id="input" placeholder="type a command for your OS…" autofocus>
    <button id="send" type="submit">SEND</button>
  </form>
</div>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");

function el(cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  if (text !== undefined) d.textContent = text;
  return d;
}

function addMsg(who, text, opts = {}) {
  const m = el("msg" + (opts.user ? " user" : "") + (opts.error ? " error" : ""));
  const w = el("who"); w.className = "who"; w.textContent = who + " › ";
  m.appendChild(w);
  m.appendChild(document.createTextNode(text));
  if (opts.agent && opts.agent !== "personal") {
    const b = el("agentbadge", opts.agent); b.className = "agentbadge"; m.appendChild(b);
  }
  if (opts.provider) {
    const p = el("agentbadge provider", opts.provider); m.appendChild(p);
  }
  chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
  return m;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = "";
  addMsg("you", text, { user: true });

  const pending = el("msg thinking", "");
  const w = el("who"); w.className = "who"; w.textContent = "osiris › ";
  pending.prepend(w);
  chat.appendChild(pending); chat.scrollTop = chat.scrollHeight;
  send.disabled = true;

  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await r.json();
    pending.remove();
    for (const t of data.tools) {
      const args = Object.entries(t.args).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
      chat.appendChild(el("tool", `${t.name}(${args})`));
    }
    addMsg("osiris", data.reply, { agent: data.agent, error: data.error, provider: data.provider });
  } catch (err) {
    pending.remove();
    addMsg("osiris", "connection lost: " + err.message, { error: true });
  } finally {
    send.disabled = false;
    input.focus();
    refreshState();
  }
});

async function refreshState() {
  try {
    const s = await (await fetch("/api/state")).json();
    document.getElementById("providers").textContent = s.providers;
    document.getElementById("memcount").textContent = s.memories + " memories";

    const goals = document.getElementById("goals");
    goals.replaceChildren();
    if (!s.goals.length) goals.appendChild(el("empty", "no active goals"));
    for (const g of s.goals) {
      const done = g.milestones.filter(m => m.status === "done").length;
      const item = el("item", `◆ ${g.title}`);
      item.appendChild(el("meta", `${done}/${g.milestones.length} milestones`));
      goals.appendChild(item);
      for (const m of g.milestones) {
        const row = el("item" + (m.status === "done" ? " done" : ""),
          `  ${m.status === "done" ? "✓" : "·"} ${m.title}`);
        goals.appendChild(row);
      }
    }

    const tasks = document.getElementById("tasks");
    tasks.replaceChildren();
    if (!s.tasks.length) tasks.appendChild(el("empty", "no pending tasks"));
    for (const t of s.tasks) {
      const item = el("item", `· ${t.description}`);
      item.appendChild(el("meta", "due " + t.due.replace("T", " ")));
      tasks.appendChild(item);
    }
  } catch { /* server restarting; try again next tick */ }
}

refreshState();
setInterval(refreshState, 10000);
</script>
</body>
</html>
